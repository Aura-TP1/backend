# Configuración de Alembic para las migraciones de AURA Sync API.

[alembic]
script_location = alembic
prepend_sys_path = .

# La URL real se carga desde la variable de entorno DATABASE_URL
# en alembic/env.py. Este valor es solo un placeholder.
sqlalchemy.url = postgresql://user:password@localhost:5432/aura_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
